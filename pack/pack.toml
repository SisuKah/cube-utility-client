# The modpack's source of truth. `npm run pack:build` turns it into the signed manifest that
# every launcher syncs to. Modrinth versions are version numbers for Minecraft 26.3 + Fabric;
# "latest" follows the newest release. Optional mods can be switched on or off by players.

name = "Cube Utility Client"
channel = "stable"
minecraft = "26.3"
loader = { type = "fabric", version = "0.20.1" }
java = { component = "java-runtime-epsilon", major = 25 }
quickPlay = "play.cubecraft.net"
allowExtraMods = true

mods = [
  # My mods that aren't on Modrinth (jars in pack/jars). Cube Utility 1.8.0 has zoom, freelook,
  # fullbright, an armour HUD, ping numbers and more chat history built in, so Zoomify, Freelook,
  # More Chat History and Armor Dura HUD left the pack with it.
  { id = "cubeutility",       name = "Cube Utility",        file = "jars/cube-utility-1.8.0+mc26.1-26.3.jar",   group = "own" },
  { id = "ewoptimizer",       name = "Eggwars Optimizer",   file = "jars/eggwars-optimizer-1.1.0.jar",          group = "own" },
  { id = "cubeutilityclient", name = "Cube Utility Client", file = "jars/cube-utility-client-1.0.0+mc26.3.jar", group = "own" },
  { id = "spectatorinside",   name = "Spectator Inside",    file = "jars/spectator-inside-1.3.0.jar",           group = "own" },
  { id = "kbdelay",           name = "KB Delay Meter",      file = "jars/kb-delay-meter-0.1.0.jar",             group = "own" },
  { id = "packetlogger",      name = "Packet Logger",       file = "jars/packet-logger-2.0.0mc26.3.jar",        group = "own" },
  # Local-only (127.0.0.1) and token-protected; each PC makes its own token.
  { id = "assistantbridge",   name = "Assistant Bridge",    file = "jars/assistant-bridge-0.3.1+mc26.3.jar",    group = "own" },
  { id = "textlayoutcache",   name = "Text Layout Cache",   file = "jars/text-layout-cache-1.0.0+mc26.3.jar",   group = "performance" },

  # My mods on Modrinth: always follow my newest 26.3 release
  { modrinth = "cubecraft-autovote",   version = "latest", group = "own" },
  { modrinth = "cubecraft-level-rank", version = "latest", group = "own" },

  # Performance, pinned: the same set as my own 26.3 game
  { modrinth = "sodium",                version = "mc26.3-0.9.2-fabric",  group = "performance" },
  { modrinth = "lithium",               version = "mc26.3-0.26.3-fabric", group = "performance" },
  { modrinth = "immediatelyfast",       version = "1.17.1+26.3-fabric",   group = "performance" },
  { modrinth = "entityculling",         version = "1.11.3",               group = "performance" },
  { modrinth = "ferrite-core",          version = "9.0.0-fabric",         group = "performance" },
  { modrinth = "dynamic-fps",           version = "3.11.10",              group = "performance" },
  { modrinth = "krypton",               version = "0.3.2",                group = "performance" },
  { modrinth = "sodium-extra",          version = "mc26.3-0.9.5+fabric",  group = "performance" },
  { modrinth = "reeses-sodium-options", version = "mc26.3-2.2.5+fabric",  group = "performance" },
  { modrinth = "badoptimizations",      version = "2.4.1",                group = "performance" },
  { modrinth = "moreculling",           version = "1.9.1",                group = "performance" },
  { modrinth = "fast-ip-ping",          version = "v1.0.12-mc26.3",       group = "performance" },

  # Libraries and UI
  { modrinth = "fabric-api",      version = "0.166.0+26.3",      group = "library" },
  { modrinth = "modmenu",         version = "21.0.0",            group = "library" },
  { modrinth = "placeholder-api", version = "3.2.0+26.3",        group = "library" },  # Mod Menu needs it
  { modrinth = "cloth-config",    version = "26.3.159+fabric",   group = "library" },
  { modrinth = "yacl",            version = "3.9.7+26.3-fabric", group = "library" },  # settings screens, e.g. Cubes Without Borders'
  # Lets servers adjust the client (made for MCC Island); in my own game too.
  { modrinth = "noxesium",        version = "3.3.0",             group = "library" },
  { modrinth = "server-resource-pack-checker", version = "fabric-1.2.2+26.3", group = "library" },

  # Optional quality of life (players can switch these on or off)
  { modrinth = "cubes-without-borders", version = "5.0.0+26.3", group = "qol", optional = true, default = "on" },
  { modrinth = "variants-cit",          version = "5.8.1+26.3", group = "qol", optional = true, default = "on" },
]

# Default config files for players, from pack/configs. "if-missing" never overwrites a
# player's own settings; "always" keeps the file identical to the pack's copy.
# These are my own settings from my 26.3 game, without anything personal (no stats, caches,
# OBS password, Assistant Bridge token or Packet Logger choices).

# My video, control and sound settings. The launcher starts each new player's options.txt from
# this, then lays the player's own settings from their other Minecraft on top.
[[configs]]
file = "configs/config/cubeutilityclient/default-options.txt"
path = "config/cubeutilityclient/default-options.txt"
policy = "always"

[[configs]]
file = "configs/config/cubeutility/config.json"
path = "config/cubeutility/config.json"
policy = "if-missing"

[[configs]]
file = "configs/config/cubeutility/bridges.json"
path = "config/cubeutility/bridges.json"
policy = "if-missing"

[[configs]]
file = "configs/config/cubeutility/build_limits.json"
path = "config/cubeutility/build_limits.json"
policy = "if-missing"

[[configs]]
file = "configs/config/sodium-options.json"
path = "config/sodium-options.json"
policy = "if-missing"

[[configs]]
file = "configs/config/sodium-extra-options.json"
path = "config/sodium-extra-options.json"
policy = "if-missing"

[[configs]]
file = "configs/config/entityculling.json"
path = "config/entityculling.json"
policy = "if-missing"

[[configs]]
file = "configs/config/immediatelyfast.json"
path = "config/immediatelyfast.json"
policy = "if-missing"

[[configs]]
file = "configs/config/moreculling.toml"
path = "config/moreculling.toml"
policy = "if-missing"

[[configs]]
file = "configs/config/dynamic_fps.json"
path = "config/dynamic_fps.json"
policy = "if-missing"

[[configs]]
file = "configs/config/cwb.json"
path = "config/cwb.json"
policy = "if-missing"

[[configs]]
file = "configs/config/badoptimizations.txt"
path = "config/badoptimizations.txt"
policy = "if-missing"

[[configs]]
file = "configs/config/ewoptimizer.json"
path = "config/ewoptimizer.json"
policy = "if-missing"

[[configs]]
file = "configs/config/lvl_rank.json"
path = "config/lvl_rank.json"
policy = "if-missing"

[[configs]]
file = "configs/config/cubeautovote.json"
path = "config/cubeautovote.json"
policy = "if-missing"

[[configs]]
file = "configs/config/spectatorinside.json"
path = "config/spectatorinside.json"
policy = "if-missing"

[[configs]]
file = "configs/config/noxesium.toml"
path = "config/noxesium.toml"
policy = "if-missing"

[[configs]]
file = "configs/config/resourcepackchecker/resourcepackchecker.properties"
path = "config/resourcepackchecker/resourcepackchecker.properties"
policy = "if-missing"
