[package]
name = "cube-utility-client"
version = "1.0.0"
description = "Auto-updating launcher for the Cube Utility CubeCraft modpack"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# Native Windows TLS (SChannel): no extra build tools needed, and it uses the Windows certificate store.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset", "system-proxy"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time", "macros", "rt"] }
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
cuc-manifest = { path = "../crates/manifest" }
