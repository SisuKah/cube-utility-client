[package]
name = "pack"
version = "0.1.0"
description = "Builds and signs the Cube Utility Client pack manifest"
edition = "2021"
publish = false

[dependencies]
cuc-manifest = { path = "../../crates/manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset", "blocking"] }
getrandom = "0.4"
